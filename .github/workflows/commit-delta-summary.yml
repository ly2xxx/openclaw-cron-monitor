name: Commit Delta Summary

on:
  push:
    branches: [main]
    paths:
      - "ai-job-monitoring/AI-jobs.md"
  pull_request:
    branches: [main]
    paths:
      - "ai-job-monitoring/AI-jobs.md"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base revision (tag, branch or SHA)"
        required: false
        default: ""
      head_ref:
        description: "Head revision (tag, branch or SHA)"
        required: false
        default: "HEAD"
      model:
        description: "Ollama Cloud model"
        required: false
        default: "deepseek-v4-flash:cloud"
      custom_prompt:
        description: "Additional instructions or custom prompt"
        required: false
        default: "For daily job scan updates to AI-jobs.md and/or AI-Enablement-Europe.md, please explicitly include a section listing all newly added/posted jobs with their Role, Company, Location, and Markdown Link."

permissions:
  contents: write
  pull-requests: write

jobs:
  summarise:
    name: Summarise delta via Ollama Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the summariser diffs two revisions, so it needs history

      - name: Summarise
        id: summary
        uses: ly2xxx/.github/actions/commit-delta-summary@main
        with:
          base: ${{ inputs.base_ref || github.event.inputs.base_ref || '' }}
          head: ${{ inputs.head_ref || github.event.inputs.head_ref || '' }}
          model: ${{ inputs.model || github.event.inputs.model || vars.OLLAMA_MODEL || 'deepseek-v4-flash:cloud' }}
          max-diff-chars: ${{ inputs.max_diff_chars || vars.MAX_DIFF_CHARS || '60000' }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}
          custom-prompt: ${{ inputs.custom_prompt || github.event.inputs.custom_prompt || vars.CUSTOM_PROMPT || 'For daily job scan updates to AI-jobs.md, please explicitly include a section listing all newly added/posted jobs with their Role, Company, Location, and Markdown Link.' }}

      - name: Upload summary
        if: steps.summary.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: commit-delta-summary
          path: ${{ steps.summary.outputs.summary-file }}
          retention-days: 14

      - name: Comment on the pull request
        if: >-
          github.event_name == 'pull_request'
          && steps.summary.outputs.skipped == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ steps.summary.outputs.summary-file }}', 'utf8');
            const marker = '<!-- commit-delta-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            )).find(c => c.body?.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
            }

      - name: Comment on the commit
        if: >-
          github.event_name == 'push'
          && steps.summary.outputs.skipped == 'false'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ steps.summary.outputs.summary-file }}', 'utf8');
            const marker = '<!-- commit-delta-summary -->';
            const { owner, repo } = context.repo;
            const commit_sha = context.sha;
            const comments = await github.rest.repos.listCommentsForCommit({
              owner,
              repo,
              commit_sha,
            });
            const existing = comments.data.find(c => c.body?.includes(marker));
            const payload = `${marker}\n${body}`;
            if (!existing) {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha,
                body: payload,
              });
            }
